paths:
  equity_data: "data/raw/equity_dataset.csv"
  macro_data: "data/raw/macro_dataset.csv"
  multi_asset: "data/raw/multi_asset_dataset.csv"
  oil_data: "data/raw/oil_dataset.csv"

portfolio:
  initial_capital: 1000000.0
  max_position_pct: 0.65        # Max 65% per asset (core Equity/Bond allocations)
  risk_tolerance_var: 0.08      # Max daily portfolio VaR: 8%
  max_drawdown_limit: 0.20      # Defensive mode trigger at 20% drawdown
  min_cash_pct: 0.05            # Always keep 5% in cash
  strategic_weights:
    Equity: 0.55
    Bond: 0.30
    Gold: 0.10
    Oil: 0.05
  defensive_weights:
    Equity: 0.20
    Bond: 0.70
    Gold: 0.10
    Oil: 0.00

trading:
  commission_rate: 0.0002       # 0.02%
  base_slippage: 0.0001         # 0.01%
  rebalance_frequency: 21       # Rebalance monthly
  drift_threshold: 0.20         # Rebalance if drift > 20%
  use_drift_rebalance: false
  drawdown_cooldown_days: 21    # Stay defensive for 1 month after breach
  defensive_risky_budget: 0.20  # Max risky allocation in defensive mode
  drawdown_recovery_buffer: 0.03 # Exit defensive mode once drawdown recovers by 3%

signals:
  buy_threshold: 0.20
  sell_threshold: -0.20
  rsi_oversold: 35
  rsi_overbought: 65

risk:
  var_confidence: 0.95
  var_lookback_days: 252
  volatility_window: 21
  momentum_short_window: 10
  momentum_long_window: 30

metrics:
  risk_free_rate: 0.05
  benchmark_ticker: "Equity"
